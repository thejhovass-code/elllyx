<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica CSS - Tarjeta de Perfil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <article class="tarjeta">
    <div class="tarjeta-cabecera">
      <img class="avatar" src="foto1.png" alt="Foto de Luna Lopez">
    </div>

    <div class="tarjeta-cuerpo">
      <h1>Luna Lopez</h1>
      <p class="rol">Estudiante de Programación Web</p>
      <p class="bio">Apasionada de la tecnología, el diseño de interfaces y el desarrollo de software. Actualmente aprendiendo HTML5, CSS3 y JavaScript.</p>

      <ul class="etiquetas">
        <li>HTML5</li>
        <li>CSS3</li>
        <li>Flexbox</li>
        <li>Git</li>
      </ul>

      <div class="acciones">
        <a class="boton boton-primario" href="#">Ver Portafolio</a>
        <a class="boton boton-secundario" href="#">Contacto</a>
      </div>
    </div>
  </article>

</body>
</html>
